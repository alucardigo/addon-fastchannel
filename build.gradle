    Para mais informações de como efetuar a correta configuração desse arquivo,
    consulte a documentação oficial da Sankkhya no link abaixo:
    <a href="https://developer.sankhya.com.br/docs/03_conf_addonstudio"/>
 */

buildscript {

    repositories{
        mavenLocal()
        mavenCentral()
        maven {
            url = uri("https://artifacts-partners.sankhya.com.br/repository/maven-releases")
        }
    }

    dependencies {
        classpath "br.com.sankhya.studio:gradle-plugin:2.0.0"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.0.0-1.0.24"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0"
    }
}

//Substitua o valor inserido em 'group' por seu domínio, por exemplo: 'br.com.suaempresa'.
group = 'br.com.bellube.fastchannel'
//Especifica a versão do addon. É útil para controle de versões, deploys e compatibilidade com o sistema.
version = (project.findProperty('ADDON_VERSION') ?: System.getenv('ADDON_VERSION') ?: "1.2.92")
//Define uma breve descrição do addon, explicando sua funcionalidade ou objetivo principal.
description = "Integração Fastchannel Data Lake - Monitoramento e Ingestão de Dados"

apply(plugin: "br.com.sankhya.addonstudio")

// Load local.properties for machine-specific configuration
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

snkmodule {
    // Server folder from local.properties or environment variable SNK_SERVER_FOLDER
    def server = localProps.getProperty('snk.serverFolder') ?: System.getenv('SNK_SERVER_FOLDER') ?: ''
    if (server.isEmpty()) {
        logger.warn("WARNING: snk.serverFolder not configured. Create local.properties with snk.serverFolder=<path>")
    }
    serverFolder = server
    plataformaMinima = "4.28"
}

addon {
    /*
        Ao habilitar o autoDDL, os scripts de criação de tabelas em dbscripts são ignorados,
        e as tabelas são geradas automaticamente com base nas entidades definidas em datadictionary*.
        Para usar scripts manuais, defina autoDDL=true. Para mais informações, consulte:
        <a href="https://developer.sankhya.com.br/docs/02_autoddl">
    */
    autoDDL=false
    //Informe aqui a sua APPKEY. Lembre-se de criar previamente sua solução e componente no Portal do Desenvolvedor.
    appKey="b262dd0f-3ca5-4219-8053-7a492f792590"
    //Informe aqui o nome da sua empresa
    parceiroNome = "BEL DISTRIBUIDOR DE LUBRIFICANTES LTDA"
}

// Garante display-name no extension.xml gerado
tasks.register('patchExtension') {
    dependsOn 'createExtensionFile'
    doLast {
        def f = file("build/dist/extension.xml")
        if (!f.exists()) return
        def parser = new XmlParser(false, false)
        def xml = parser.parse(f)
        def displayNameNode = xml.'display-name'
        if (!displayNameNode || !displayNameNode.text()) {
            // insere logo após o id
            def children = xml.children()
            def insertIdx = children.findIndexOf { it instanceof Node && it.name() == 'id' } + 1
            children.add(insertIdx, new Node(null, 'display-name', 'Fastchannel Integration'))
        }
        def vendorNode = (xml.'vendor' && xml.'vendor'.size() > 0) ? xml.'vendor'[0] : null
        if (!vendorNode) {
            vendorNode = new Node(xml, 'vendor')
            new Node(vendorNode, 'name', 'BEL DISTRIBUIDOR DE LUBRIFICANTES LTDA')
        }

        def licenseId = System.getenv('ADDON_LICENSE_ID') ?: (project.hasProperty('ADDON_LICENSE_ID') ? project.getProperty('ADDON_LICENSE_ID') : null)
        def normalizedLicenseId = licenseId?.trim()
        if (normalizedLicenseId) {
            def vendorId = (vendorNode.'id' && vendorNode.'id'.size() > 0) ? vendorNode.'id'[0] : null
            if (vendorId) {
                vendorId.value = [normalizedLicenseId]
            } else {
                new Node(vendorNode, 'id', normalizedLicenseId)
            }

            def licenseNode = (xml.'license-by-resource' && xml.'license-by-resource'.size() > 0) ? xml.'license-by-resource'[0] : null
            if (!licenseNode) {
                licenseNode = new Node(xml, 'license-by-resource')
            }
            def defaultMod = (licenseNode.'default-module' && licenseNode.'default-module'.size() > 0) ? licenseNode.'default-module'[0] : null
            if (defaultMod) {
                defaultMod.value = [normalizedLicenseId]
            } else {
                new Node(licenseNode, 'default-module', normalizedLicenseId)
            }
        } else {
            // Keep template-compatible shape: <license-by-resource><default-module/></license-by-resource>
            if (vendorNode.'id') {
                vendorNode.'id'.each { vendorNode.remove(it) }
            }
            def licenseNode = (xml.'license-by-resource' && xml.'license-by-resource'.size() > 0) ? xml.'license-by-resource'[0] : null
            if (!licenseNode) {
                licenseNode = new Node(xml, 'license-by-resource')
            }
            def defaultMod = (licenseNode.'default-module' && licenseNode.'default-module'.size() > 0) ? licenseNode.'default-module'[0] : null
            if (!defaultMod) {
                new Node(licenseNode, 'default-module', '')
            } else {
                defaultMod.value = ['']
            }
        }
        def writer = new StringWriter()
        def printer = new XmlNodePrinter(new PrintWriter(writer))
        printer.preserveWhitespace = true
        printer.print(xml)
        f.setText(writer.toString(), 'UTF-8')
    }
}

// Evita multiplos WARs no dist/web ainda na fase de configuracao do addon
tasks.matching { it.name == 'configureAddon' }.all { task ->
    task.doLast {
        def webDir = file("$buildDir/dist/web")
        if (webDir.exists()) {
            fileTree(webDir) {
                include '*.war'
                exclude 'addon-fastchannel-web.war'
            }.files.each { it.delete() }
        }
    }
}

// [CRIT-JAPE] Remove libs-master.jar do WAR final para evitar classloader conflict.
//
// Root cause: libs-master.jar contem br.com.sankhya.jape.core.JapeSessionLifeCycle (interface).
// Quando o WAR carrega essa interface via seu classloader isolado, a implementacao
// JapeSessionLifeCycleImpl (do erpcore) que implementa a interface do classloader pai NAO
// pode ser castada para a copia da interface no WAR -> ClassCastException em
// Jape.parametersLoaded:342, que quebra a inicializacao do provider JAPE.
//
// libs-master.jar eh dependencia do plugin addonstudio usada apenas em COMPILE-TIME.
// Em runtime o WildFly ja fornece via erpcore.ear (classloader pai).
//
// IMPORTANTE: mge-modelcore-master.jar NAO eh removido. Ele contem as VOs de dominio
// (CabecalhoNotaVO, ItemNotaVO, ParceiroVO), o DynamicEntityLoader do provider DWF do addon,
// e classes do broker EJB (sun.proxy wrappers) usadas pela ServiceInvokerStrategy.
// Remove-lo quebra o ServiceInvoker em homolog com "Could not initialize class
// com.sun.proxy.$Proxy1613" e "Nenhum provedor encontrado para CACSP.incluirNota".
// Essas VOs sao versoes do addon e nao colidem com o classloader pai porque o pai nao
// exporta os mesmos FQCNs (ou exporta compativelmente).
//
// Jars filtrados:
//   - libs-master.jar             (~1.5MB, contem br.com.sankhya.jape.*, parameter.*, dwf.*)
def BLOCKED_RUNTIME_JARS = [
    'libs-master.jar'
] as Set

// Configuracao apos a evaluation de subprojects para pegar :vc:war corretamente
gradle.projectsEvaluated {
    def stripAction = {
        ['vc/buildGradle/libs', 'build/dist/web', 'build/tmp/warWithExtension/WEB-INF/lib', 'build/dist/lib']
            .collect { file(it) }
            .findAll { it.exists() }
            .each { dir ->
                fileTree(dir).include('*.war', '**/*.war').files.each { warFile ->
                    stripJarsFromWar(warFile, BLOCKED_RUNTIME_JARS)
                }
                fileTree(dir).include('*.jar').files.each { jarFile ->
                    if (BLOCKED_RUNTIME_JARS.contains(jarFile.name)) {
                        logger.lifecycle("[CRIT-JAPE] removing conflicting jar from dir: ${jarFile}")
                        jarFile.delete()
                    }
                }
            }
    }
    [':vc:war', ':vc:buildWar', 'configureAddon', 'gerarAddon', 'publishAddon'].each { taskPath ->
        def t = tasks.findByPath(taskPath)
        if (t != null) {
            t.doLast(stripAction)
        }
    }
}

ext.stripJarsFromWar = { java.io.File warFile, Set blockedNames ->
    if (!warFile.exists()) return
    def tmpDir = new File(buildDir, "tmp/warStrip-${warFile.name}-${System.currentTimeMillis()}")
    tmpDir.mkdirs()
    try {
        def anyRemoved = false
        def ant = new groovy.ant.AntBuilder()
        ant.unzip(src: warFile.absolutePath, dest: tmpDir.absolutePath, overwrite: 'true')
        new File(tmpDir, 'WEB-INF/lib').with { libDir ->
            if (libDir.exists()) {
                libDir.listFiles()?.findAll { blockedNames.contains(it.name) }?.each { conflict ->
                    logger.lifecycle("[CRIT-JAPE] removing from ${warFile.name}: WEB-INF/lib/${conflict.name}")
                    conflict.delete()
                    anyRemoved = true
                }
            }
        }
        if (anyRemoved) {
            warFile.delete()
            ant.zip(destfile: warFile.absolutePath, basedir: tmpDir.absolutePath)
        }
    } finally {
        tmpDir.deleteDir()
    }
}

// Ensure dbscripts XML are available for ddmigration
  tasks.register('syncDbScripts') {
      doLast {
          def srcDir = file("dbscripts")
          if (!srcDir.exists()) return
          def destDir = file("build/dist/dbscripts")
          destDir.mkdirs()
          project.copy {
              from(srcDir)
              into(destDir)
              include "V*.xml"
          }
      }
  }

tasks.register('prepareServiceProviders') {
    doLast {
        def manualSp = file("vc/src/main/webapp/WEB-INF/resources/service-providers.xml.manual")
        def baseSp = file("vc/src/main/webapp/WEB-INF/resources/service-providers.xml")
        def spSource = manualSp.exists() ? manualSp : baseSp
        if (!spSource.exists()) return
        def content = spSource.getText('ISO-8859-1')
        [
            "vc/buildGradle/resources/main/WEB-INF/resources/service-providers.xml",
            "vc/buildGradle/studioGenerated/resources/WEB-INF/resources/service-providers.xml"
        ].each { t ->
            def dest = file(t)
            dest.parentFile.mkdirs()
            dest.text = content
        }
    }
}

// Enriquece metadata.xml com tabelas/campos/instancias garantidos (padrao ICONIC)
tasks.whenTaskAdded { task ->
    if (task.name == 'convertMetadata') {
        task.doLast {
            def metaFile = file("$buildDir/dist/datadictionary/metadata.xml")
            if (!metaFile.exists()) {
                return
            }

            def meta = new XmlParser().parse(metaFile)
            def tablesNode = meta.tables[0]
            def fieldsNode = meta.fields[0]
            def propsNode = meta.fieldProperties[0]
            def instancesNode = meta.instances[0]

            def ensureTable = { name, desc ->
                if (!tablesNode.table.find { it.@name == name }) {
                    def t = tablesNode.appendNode('table', [name: name, sequenceType: 'N'])
                    t.appendNode('description').setValue(desc)
                }
            }
            def ensureField = { table, f ->
                def expectedPresentation = f.presentationType ?: 'P'
                def expectedAllowSearch = f.allowSearch ?: 'N'
                def expectedVisibleOnSearch = f.visibleOnSearch ?: 'N'
                def expectedIsPresentation = f.isPresentation ?: 'N'

                def node = fieldsNode.field.find { it.@table == table && it.@name == f.name }
                if (node) {
                    node.@dataType = f.dataType
                    node.@presentationType = expectedPresentation
                    node.@allowSearch = expectedAllowSearch
                    node.@visibleOnSearch = expectedVisibleOnSearch
                    node.@isPresentation = expectedIsPresentation
                    node.@allowDefault = 'S'
                    node.@order = node.@order ?: '0'
                } else {
                    def attrs = [
                            name            : f.name,
                            table           : table,
                            dataType        : f.dataType,
                            presentationType: expectedPresentation,
                            calculated      : 'N',
                            allowSearch     : expectedAllowSearch,
                            allowDefault    : 'S',
                            visibleOnSearch : expectedVisibleOnSearch,
                            isPresentation  : expectedIsPresentation,
                            order           : '0'
                    ]
                    node = fieldsNode.appendNode('field', attrs)
                    node.appendNode('description').setValue(f.desc)
                }

                def ensurePropValue = { propName, propValue ->
                    def propNode = propsNode.prop.find { it.@table == table && it.@field == f.name && it.@name == propName }
                    if (propNode) {
                        propNode.setValue(propValue)
                    } else {
                        propsNode.appendNode('prop', [table: table, field: f.name, name: propName]).setValue(propValue)
                    }
                }

                ensurePropValue('visivel', 'S')
                ensurePropValue('requerido', 'N')
            }
            def ensureInstance = { name, table, desc ->
                if (!instancesNode.instance.find { it.@name == name }) {
                    def inst = instancesNode.appendNode('instance', [name: name, tableName: table])
                    inst.appendNode('description').setValue(desc)
                }
            }

            // Garante tabelas FastChannel
            ensureTable('AD_FCCONFIG', 'Configuracao da Integracao Fastchannel Commerce')
            ensureTable('AD_FCQUEUE', 'Fila de Sincronizacao Fastchannel (Outbox Pattern)')
            ensureTable('AD_FCDEPARA', 'De-Para de Entidades Sankhya x Fastchannel')
            ensureTable('AD_FCPEDIDO', 'Mapeamento de Pedidos Fastchannel x Sankhya')
            ensureTable('AD_FCLOG', 'Log de Operacoes Fastchannel')

            // Garante campos criticos de cada tabela
            [
                    // AD_FCCONFIG
                    [table: 'AD_FCCONFIG', name: 'CODCONFIG', desc: 'Codigo', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S', isPresentation: 'S'],
                    [table: 'AD_FCCONFIG', name: 'ATIVO', desc: 'Ativo', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'BASE_URL', desc: 'URL Base da API', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'AUTH_URL', desc: 'URL de Autenticacao', dataType: 'S'],
                    [table: 'AD_FCCONFIG', name: 'CLIENT_ID', desc: 'Client ID OAuth2', dataType: 'S'],
                    [table: 'AD_FCCONFIG', name: 'CLIENT_SECRET', desc: 'Client Secret OAuth2', dataType: 'S'],
                    [table: 'AD_FCCONFIG', name: 'SCOPE', desc: 'Scope OAuth2', dataType: 'S'],
                    [table: 'AD_FCCONFIG', name: 'RESELLER_ID', desc: 'ID do Revendedor', dataType: 'S', allowSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'STORAGE_ID', desc: 'ID do Deposito', dataType: 'S', allowSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'CODEMP', desc: 'Empresa Padrao', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'CODLOCAL', desc: 'Local de Estoque', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'CODTIPOPER', desc: 'Tipo de Operacao', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'BATCH_SIZE', desc: 'Tamanho do Lote', dataType: 'I'],
                    [table: 'AD_FCCONFIG', name: 'LAST_ORDER_SYNC', desc: 'Ultima Sync Pedidos', dataType: 'H', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCCONFIG', name: 'LAST_STOCK_SYNC', desc: 'Ultima Sync Estoque', dataType: 'H'],
                    [table: 'AD_FCCONFIG', name: 'LAST_PRICE_SYNC', desc: 'Ultima Sync Precos', dataType: 'H'],
                    // AD_FCQUEUE
                    [table: 'AD_FCQUEUE', name: 'IDQUEUE', desc: 'ID do item na fila', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S', isPresentation: 'S'],
                    [table: 'AD_FCQUEUE', name: 'ENTITY_TYPE', desc: 'Tipo da entidade', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCQUEUE', name: 'OPERATION', desc: 'Operacao', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCQUEUE', name: 'ENTITY_ID', desc: 'ID da entidade no Sankhya', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCQUEUE', name: 'STATUS', desc: 'Status do Item', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCQUEUE', name: 'RETRY_COUNT', desc: 'Tentativas', dataType: 'I'],
                    [table: 'AD_FCQUEUE', name: 'DH_CRIACAO', desc: 'Data/hora de criacao', dataType: 'H', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCQUEUE', name: 'DH_PROCESSAMENTO', desc: 'Data/hora processamento', dataType: 'H', allowSearch: 'S'],
                    // AD_FCDEPARA
                    [table: 'AD_FCDEPARA', name: 'IDDEPARA', desc: 'ID do mapeamento', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S', isPresentation: 'S'],
                    [table: 'AD_FCDEPARA', name: 'TIPO_ENTIDADE', desc: 'Tipo da Entidade', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCDEPARA', name: 'COD_SANKHYA', desc: 'Codigo no Sankhya', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCDEPARA', name: 'COD_EXTERNO', desc: 'Codigo no Fastchannel', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCDEPARA', name: 'INTEGRA_AUTO', desc: 'Integracao automatica (S/N)', dataType: 'S', allowSearch: 'S'],
                    // AD_FCPEDIDO
                    [table: 'AD_FCPEDIDO', name: 'IDPEDIDO', desc: 'ID do registro', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'ORDER_ID', desc: 'ID do pedido no Fastchannel', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S', isPresentation: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'NUNOTA', desc: 'Numero unico da nota', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'CODPARC', desc: 'Codigo do parceiro', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'STATUS_FC', desc: 'Status no Fastchannel', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'STATUS_SKW', desc: 'Status no Sankhya', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'DH_IMPORTACAO', desc: 'Data/hora importacao', dataType: 'H', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'STATUS_IMPORT', desc: 'Status da importacao', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'NOME_CLIENTE', desc: 'Nome do cliente', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCPEDIDO', name: 'CPF_CNPJ', desc: 'CPF ou CNPJ', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    // AD_FCLOG
                    [table: 'AD_FCLOG', name: 'IDLOG', desc: 'ID do log', dataType: 'I', allowSearch: 'S', visibleOnSearch: 'S', isPresentation: 'S'],
                    [table: 'AD_FCLOG', name: 'NIVEL', desc: 'Nivel', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCLOG', name: 'OPERACAO', desc: 'Tipo de Operacao', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCLOG', name: 'MENSAGEM', desc: 'Mensagem do log', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCLOG', name: 'REFERENCIA', desc: 'Referencia', dataType: 'S', allowSearch: 'S', visibleOnSearch: 'S'],
                    [table: 'AD_FCLOG', name: 'DH_REGISTRO', desc: 'Data/hora do registro', dataType: 'H', allowSearch: 'S', visibleOnSearch: 'S'],
            ].each { f ->
                ensureField(f.table, f)
            }

            // Garante instancias
            ensureInstance('FC_Configuracao', 'AD_FCCONFIG', 'Configuracao Fastchannel')
            // [CRIT-3] FC_FilaSincronizacao removida - Fila de Sincronizacao descontinuada
            ensureInstance('FC_DePara', 'AD_FCDEPARA', 'De-Para Sankhya x Fastchannel')
            ensureInstance('FC_Pedidos', 'AD_FCPEDIDO', 'Pedidos Fastchannel')
            ensureInstance('FC_Logs', 'AD_FCLOG', 'Logs da Integracao Fastchannel')

            metaFile.withOutputStream { os ->
                def writer = new PrintWriter(new OutputStreamWriter(os, 'ISO-8859-1'))
                def printer = new groovy.xml.XmlNodePrinter(writer)
                printer.setPreserveWhitespace(true)
                printer.print(meta)
                writer.flush()
            }
            println ">>> metadata.xml enriquecido com tabelas/campos/instancias FastChannel"
        }
